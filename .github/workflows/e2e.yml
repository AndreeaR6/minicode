{
"name": "e2e",
"on": {
"pull_request": {"paths": ["e2e/**"]},
"workflow_dispatch": {},
"schedule": [{"cron": "17 5 * * *"}]
},
"jobs": {
"playwright": {
"runs-on": "ubuntu-latest",
"defaults": {"run": {"working-directory": "e2e"}},
"env": {"BASE_URL": "https://bug-free-guide.savuandreea1.workers.dev", "CI": "true"},
"steps": [
{"uses": "actions/checkout@v4"},
{"uses": "actions/setup-node@v4", "with": {"node-version": "22"}},
{"run": "npm install"},
{"run": "npx playwright install --with-deps chromium"},
{"run": "npx playwright test"},
{"if": "always()", "uses": "actions/upload-artifact@v4", "with": {"name": "playwright-report", "path": "e2e/playwright-report", "retention-days": 14}}
]
}
}
}
